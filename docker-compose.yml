version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: industryxlink-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    container_name: industryxlink-redis
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./backend
    container_name: industryxlink-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/industryxlink
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_development_only
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: industryxlink-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo-data:
