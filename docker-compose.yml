version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: industryxlink_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepassword

  mongo-express:
    image: mongo-express
    container_name: industryxlink_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: examplepassword
      ME_CONFIG_MONGODB_URL: mongodb://root:examplepassword@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo_data:
